name: nuget-publish

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore LoraDb.Client/LoraDb.Client.csproj
      - name: Pack
        run: dotnet pack LoraDb.Client/LoraDb.Client.csproj -c Release -o ./artifacts --no-restore
      - name: Push
        if: ${{ secrets.NUGET_API_KEY != '' }}
        run: dotnet nuget push ./artifacts/*.nupkg --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
