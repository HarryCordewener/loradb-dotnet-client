name: nuget-publish

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Determine version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Restore
        run: dotnet restore LoraDb.Client.slnx
      - name: Build
        run: dotnet build LoraDb.Client.slnx --configuration Release --no-restore
      - name: Run tests
        run: dotnet test LoraDb.Client.slnx --configuration Release --no-restore --no-build
      - name: Generate changelog fragment
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
      - name: Pack
        run: |
          if [[ -f RELEASE_NOTES.md ]]; then
            RELEASE_NOTES="$(sed ':a;N;$!ba;s/\r//g;s/\n/ /g' RELEASE_NOTES.md | sed -E 's/[[:space:]]+/ /g; s/^ //; s/ $//')"
          else
            RELEASE_NOTES=""
          fi
          RELEASE_NOTES_ESCAPED="${RELEASE_NOTES//\"/\\\"}"
          dotnet pack LoraDb.Client/LoraDb.Client.csproj \
            -c Release \
            -o ./artifacts \
            --no-restore \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:PackageReleaseNotes="\"${RELEASE_NOTES_ESCAPED}\""
          dotnet pack LoraDb.Client.Native/LoraDb.Client.Native.csproj \
            -c Release \
            -o ./artifacts \
            --no-restore \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:PackageReleaseNotes="\"${RELEASE_NOTES_ESCAPED}\""
      - name: NuGet login (Trusted Publishing)
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ github.repository_owner }}
      - name: Push to NuGet.org
        run: dotnet nuget push ./artifacts/*.nupkg --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
      - name: Push to GitHub Packages
        run: dotnet nuget push ./artifacts/*.nupkg --api-key "${{ secrets.GITHUB_TOKEN }}" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate
