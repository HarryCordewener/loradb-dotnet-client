name: nuget-publish

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Determine version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Restore
        run: dotnet restore LoraDb.Client.slnx
      - name: Build tests
        run: dotnet build LoraDb.Client.slnx --configuration Release --no-restore
      - name: Run tests
        run: dotnet test LoraDb.Client.slnx --configuration Release --no-restore --no-build
      - name: Generate changelog fragment
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
      - name: Pack
        run: |
          dotnet pack LoraDb.Client/LoraDb.Client.csproj \
            -c Release \
            -o ./artifacts \
            --no-restore \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:PackageReleaseNotes="$(cat RELEASE_NOTES.md 2>/dev/null || echo '')"
      - name: Push to GitHub Packages
        continue-on-error: true
        run: dotnet nuget push ./artifacts/*.nupkg --api-key "${{ secrets.GITHUB_TOKEN }}" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate
