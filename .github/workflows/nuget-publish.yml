name: nuget-publish

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Determine version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Restore
        run: dotnet restore LoraDb.Client.slnx
      - name: Build tests
        run: dotnet build LoraDb.Client.slnx --configuration Release --no-restore
      - name: Run tests
        run: dotnet test LoraDb.Client.slnx --configuration Release --no-restore --no-build
      - name: Generate changelog fragment
        uses: orhun/git-cliff-action@v3
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
      - name: Pack
        run: |
          dotnet pack LoraDb.Client/LoraDb.Client.csproj \
            -c Release \
            -o ./artifacts \
            --no-restore \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:PackageReleaseNotes="$(cat RELEASE_NOTES.md 2>/dev/null || echo '')"
          dotnet pack LoraDb.Client.Native/LoraDb.Client.Native.csproj \
            -c Release \
            -o ./artifacts \
            --no-restore \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:PackageReleaseNotes="$(cat RELEASE_NOTES.md 2>/dev/null || echo '')"
      - name: Push
        if: ${{ secrets.NUGET_API_KEY != '' }}
        run: dotnet nuget push ./artifacts/*.nupkg --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
