name: ci

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore LoraDb.Client.slnx
      - name: Build
        run: dotnet build LoraDb.Client.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet run --project LoraDb.Client.Tests/LoraDb.Client.Tests.csproj --configuration Release --no-build -- --coverage --coverage-output-format cobertura
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: "**/*.cobertura.xml"
          fail_ci_if_error: false
