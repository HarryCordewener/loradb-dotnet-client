name: ci

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore LoraDb.Client.slnx
      - name: Build
        run: dotnet build LoraDb.Client.slnx --configuration Release --no-restore
      - name: Run unit tests
        run: dotnet test LoraDb.Client.Tests/LoraDb.Client.Tests.csproj --configuration Release --no-build -- --coverage --coverage-output-format cobertura
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v6
        with:
          files: "**/*.cobertura.xml"
          fail_ci_if_error: false

  integration:
    name: integration (http + ffi)
    runs-on: ubuntu-latest
    env:
      LORADB_RUN_INTEGRATION_TESTS: "1"
      LORADB_FFI_LIBRARY_PATH: ${{ github.workspace }}/LoraDb.Client.Native/runtimes/linux-x64/native/liblora_ffi.so
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore LoraDb.Client.slnx
      - name: Build
        run: dotnet build LoraDb.Client.slnx --configuration Release --no-restore
      - name: Run integration tests
        run: dotnet test LoraDb.Client.IntegrationTests/LoraDb.Client.IntegrationTests.csproj --configuration Release --no-build
